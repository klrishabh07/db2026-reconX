<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- TICKET-ADV100 — read saved theme BEFORE the stylesheet paints to eliminate FOUC -->
  <script>
    (function () {
      var saved = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
  <header class="app-header" role="banner">
    <h1 class="app-title">ReconX</h1>
    <nav class="app-nav" aria-label="Main navigation">
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="trades.html">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <!-- TICKET-ADV104 — SSE connection status badge -->
    <span id="sse-status" class="sse-badge">Connecting…</span>
    <button id="theme-toggle" aria-label="Toggle light/dark theme">&#127767;</button>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" role="complementary">
      <h2>Quick filters</h2>
      <ul>
        <li><a href="#">All trades</a></li>
        <li><a href="#">Open breaks</a></li>
        <li><a href="#">Today</a></li>
      </ul>
    </aside>

  <main class="layout__main" role="main">
    <section aria-labelledby="kpi">
      <h2 id="kpi">Today at a glance</h2>
      <div class="stat-grid">
        <article class="stat-card"><h3>Trades</h3><p>120</p></article>
        <article class="stat-card"><h3>Matched</h3><p>105</p></article>
        <article class="stat-card stat-card--warn"><h3>Open breaks</h3><p>15</p></article>
        <article class="stat-card"><h3>Notional</h3><p>$24.3M</p></article>
      </div>
      <!-- TICKET-ADV102 — pulsing danger alert -->
      <div class="alert--danger" role="alert">
        &#9888; 15 open reconciliation breaks &mdash; investigate now
      </div>
    </section>

    <section aria-labelledby="feed">
      <h2 id="feed">Live trade feed</h2>
      <!-- TICKET-ADV100 — aria-live so screen readers announce new trades -->
      <div id="trade-feed" role="status" aria-live="polite" aria-atomic="false"></div>
    </section>
  </main>

  <footer class="layout__footer" role="contentinfo">
    <small>ReconX TDI 2026 &middot; static dashboard (Day 7)</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/sse.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
